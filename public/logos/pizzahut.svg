<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
  <rect width="200" height="180" fill="white" rx="12"/>
  <!-- Red roof/hut shape -->
  <polygon points="100,15 175,75 155,75 155,100 45,100 45,75 25,75" fill="#EE3124"/>
  <!-- Chimney -->
  <rect x="88" y="10" width="24" height="30" fill="#EE3124" rx="3"/>
  <!-- White stripe on roof -->
  <polygon points="100,30 160,75 140,75 100,46 60,75 40,75" fill="white" opacity="0.3"/>
  <!-- Pizza Hut text -->
  <text x="100" y="130" font-family="'Arial Black',Impact,sans-serif" font-size="22" font-weight="900" fill="#EE3124" text-anchor="middle">Pizza Hut</text>
  <!-- Red bar -->
  <rect x="20" y="138" width="160" height="6" fill="#EE3124" rx="3"/>
</svg>
